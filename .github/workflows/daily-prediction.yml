name: Daily Crypto & Stock Prediction

on:
  schedule:
    # 11:30 AM UTC = 5:00 PM IST (India) daily
    - cron: '30 11 * * *'
  workflow_dispatch:  # lets you trigger manually from GitHub Actions tab

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit results back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance pandas numpy pillow

      - name: Run crypto prediction tracker (CoinMarketCap)
        run: python prediction_tracker.py
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

      - name: Run stock prediction tracker
        run: python stock_tracker.py

      - name: Build landing page data
        run: python site/build_summary.py

      - name: Build 3-day and 7-day forecast (CoinMarketCap + tuned weights from backtest/results.json)
        run: python site/build_forecast.py
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        continue-on-error: true   # an API hiccup here should not block the daily update

      - name: Build post kit (captions + share images) and call pages data
        run: python site/build_posts.py
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}   # empty = posts carry no link
        continue-on-error: true

      - name: Commit and push updated files
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add prediction_data.json prediction_dashboard.html prediction_dashboard_3d.html \
                  stock_data.json stock_dashboard.html \
                  site/summary.json site/history.json
          git add site/forecast.json 2>/dev/null || true
          git add -A posts site/calls.json 2>/dev/null || true
          # Only commit if something changed
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily prediction update $(date -u +%Y-%m-%d)"
            git push
          fi
