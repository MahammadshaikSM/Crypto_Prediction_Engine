<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ichnora · B4 colour variations</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1600px; background: #1a1a20; font-family: Inter, sans-serif; color: #F4F4EF; padding: 50px 56px 70px; }
  h1 { font: 800 42px "Bricolage Grotesque"; letter-spacing: -.03em; }
  .sub { color: #A1A1AC; margin-top: 6px; font-size: 17px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 28px; }
  .card { border-radius: 22px; overflow: hidden; border: 1px solid #ffffff1a; background: #07070A; }
  .stage { display: flex; align-items: center; justify-content: space-between; padding: 22px 22px 16px; }
  .sizes { display: flex; align-items: end; gap: 10px; }
  .word { padding: 6px 22px 16px; }
  .word svg { height: 46px; width: auto; display: block; }
  .light { background: #F7F6F1; padding: 14px 22px; display: flex; align-items: center; gap: 12px; }
  .light svg.w { height: 34px; width: auto; }
  .info { padding: 12px 22px 16px; background: #111116; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .info b { font: 800 18px "Bricolage Grotesque"; }
  .info span { font: 500 12px "JetBrains Mono"; color: #A1A1AC; text-align: right; }
  .ok { color: #9BE15D; } .warn { color: #FFB86B; }
</style>
</head>
<body>
<h1>B4 · colour variations</h1>
<p class="sub">Same "Trail i" tile in 14 colourways. Contrast = glyph vs tile (4.5+ is great at tiny sizes, 3+ is fine for icons).</p>
<div class="grid" id="grid"></div>
<script>
// [name, tile (solid or [from,to]), glyph colour, dot colour]
const C = [
  ["Acid Lime",        "#D4FF3A", "#0B0B0F", "#0B0B0F"],
  ["Electric Blue",    "#2F6BFF", "#FFFFFF", "#FFFFFF"],
  ["Ultra Violet",     "#7C5CFF", "#FFFFFF", "#FFFFFF"],
  ["Signal Orange",    "#FF6A2B", "#0B0B0F", "#0B0B0F"],
  ["Mint",             "#3DFFB5", "#0B0B0F", "#0B0B0F"],
  ["Gold",             "#FFC83D", "#0B0B0F", "#0B0B0F"],
  ["Hot Pink",         "#FF4D9A", "#0B0B0F", "#0B0B0F"],
  ["Ice",              "#F4F4EF", "#0B0B0F", "#0B0B0F"],
  ["Lime → Cyan",      ["#D4FF3A", "#3DE8FF"], "#0B0B0F", "#0B0B0F"],
  ["Violet → Blue",    ["#8B5CF6", "#2F6BFF"], "#FFFFFF", "#FFFFFF"],
  ["Sunset",           ["#FF7A3D", "#FF3D8B"], "#0B0B0F", "#0B0B0F"],
  ["Blue + Lime dot",  "#2F6BFF", "#FFFFFF", "#D4FF3A"],
  ["Ink + Lime dot",   "#0B0B0F", "#F4F4EF", "#D4FF3A"],
  ["Violet + Lime dot", "#5B3DF5", "#FFFFFF", "#D4FF3A"],
];
const lum = (hex) => { const c = hex.match(/\w\w/g).map((x) => parseInt(x, 16) / 255).map((v) => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const contrast = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); };
let gid = 0;
const icon = (tile, glyph, dot, size) => {
  const id = "g" + (gid++);
  const fill = Array.isArray(tile) ? `url(#${id})` : tile;
  const grad = Array.isArray(tile) ? `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${tile[0]}"/><stop offset="1" stop-color="${tile[1]}"/></linearGradient></defs>` : "";
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120">${grad}<rect width="120" height="120" rx="30" fill="${fill}"/>
    <circle cx="60" cy="31" r="14" fill="${dot}"/>
    <rect x="51" y="54" width="18" height="15" rx="7.5" fill="${glyph}"/><rect x="51" y="74" width="18" height="13" rx="6.5" fill="${glyph}" fill-opacity=".55"/><rect x="51" y="92" width="18" height="11" rx="5.5" fill="${glyph}" fill-opacity=".25"/></svg>`;
};
const word = (letters, dot, cls) => `<svg class="${cls || ""}" viewBox="0 0 470 120"><circle cx="23" cy="27" r="12.5" fill="${dot}"/>
  <rect x="12" y="47" width="22" height="19" rx="9.5" fill="${letters}"/><rect x="12" y="69" width="22" height="15" rx="7.5" fill="${letters}" fill-opacity=".6"/><rect x="12" y="87" width="22" height="13" rx="6.5" fill="${letters}" fill-opacity=".3"/>
  <text x="47" y="100" font-family="Bricolage Grotesque" font-weight="800" font-size="104" letter-spacing="-4" fill="${letters}">chnora</text></svg>`;
document.getElementById("grid").innerHTML = C.map(([name, tile, glyph, dot]) => {
  const base = Array.isArray(tile) ? tile[1] : tile;
  const cr = contrast(glyph, Array.isArray(tile) ? (lum(tile[0]) < lum(tile[1]) ? tile[1] : tile[0]) : tile);
  const accent = dot !== glyph ? dot : (Array.isArray(tile) ? tile[0] : tile);
  const accentOnDark = accent === "#0B0B0F" ? "#F4F4EF" : accent;
  const accentOnLight = ["#F4F4EF", "#D4FF3A", "#3DFFB5", "#FFC83D"].includes(accent) ? "#0B0B0F" : accent;
  return `<div class="card">
    <div class="stage">${icon(tile, glyph, dot, 110)}<div class="sizes">${icon(tile, glyph, dot, 40)}${icon(tile, glyph, dot, 24)}${icon(tile, glyph, dot, 16)}</div></div>
    <div class="word">${word("#F4F4EF", accentOnDark)}</div>
    <div class="light">${icon(tile, glyph, dot, 34)}${word("#0B0B0F", accentOnLight, "w")}</div>
    <div class="info"><b>${name}</b><span>${Array.isArray(tile) ? tile.join(" → ") : tile}<br><span class="${cr >= 4.5 ? "ok" : cr >= 3 ? "ok" : "warn"}">contrast ${cr.toFixed(1)}</span></span></div>
  </div>`;
}).join("");
</script>
</body>
</html>
