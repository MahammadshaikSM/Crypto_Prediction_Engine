<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ichnora · colourways in context</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1600px; background: #1a1a20; font-family: Inter, sans-serif; color: #F4F4EF; padding: 46px 56px 60px; }
  h1 { font: 800 40px "Bricolage Grotesque"; letter-spacing: -.03em; }
  .sub { color: #A1A1AC; margin-top: 6px; font-size: 17px; }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 26px; }
  .col { display: grid; gap: 14px; align-content: start; }
  .label { font: 800 24px "Bricolage Grotesque"; display: flex; align-items: center; gap: 10px; }
  .label i { width: 18px; height: 18px; border-radius: 6px; display: inline-block; }
  .box { border-radius: 18px; overflow: hidden; border: 1px solid #ffffff1a; }
  /* site header + hero */
  .site { background: #07070A; padding: 16px 20px 26px; }
  .nav { display: flex; align-items: center; justify-content: space-between; }
  .nav .brand { display: flex; align-items: center; gap: 10px; font: 800 22px "Bricolage Grotesque"; letter-spacing: -.02em; }
  .nav .btn { font: 700 12px Inter; padding: 8px 14px; border-radius: 999px; color: #0B0B0F; }
  .hero { margin-top: 28px; font: 800 44px/.95 "Bricolage Grotesque"; letter-spacing: -.04em; }
  .hero mark { color: #0B0B0F; padding: 0 .08em; border-radius: .12em; }
  .tagline { margin-top: 12px; font: 500 12px "JetBrains Mono"; letter-spacing: .08em; text-transform: uppercase; color: #A1A1AC; }
  /* profile */
  .profile { background: #000; }
  .banner { height: 86px; }
  .pbody { padding: 0 18px 18px; }
  .avatar { width: 84px; height: 84px; border-radius: 50%; border: 4px solid #000; margin-top: -42px; overflow: hidden; }
  .pname { font: 800 20px Inter; margin-top: 8px; }
  .phandle { color: #71767B; font-size: 15px; }
  .pbio { margin-top: 10px; font-size: 14.5px; line-height: 1.45; }
  /* browser tab */
  .tabs { background: #DEE1E6; padding: 10px 12px 0; display: flex; gap: 6px; }
  .tab { background: #fff; color: #202124; border-radius: 10px 10px 0 0; padding: 9px 14px; display: flex; align-items: center; gap: 8px; font-size: 13px; width: 230px; }
  .tab.dim { background: transparent; color: #5f6368; width: 170px; }
  .tab .fav { width: 16px; height: 16px; border-radius: 3px; background: #c4c7cc; }
  /* post card */
  .post { background: #07070A; padding: 18px 20px; }
  .ptop { display: flex; align-items: center; justify-content: space-between; }
  .ptitle { font: 800 30px "Bricolage Grotesque"; letter-spacing: -.02em; margin-top: 10px; }
  .bar { height: 6px; border-radius: 3px; background: #24242c; margin: 14px 0 6px; position: relative; }
  .bar i { position: absolute; inset: 0 40% 0 0; border-radius: 3px; }
  .row { display: flex; justify-content: space-between; background: #111117; border-radius: 10px; padding: 9px 12px; margin-top: 7px; font: 600 14px Inter; }
  .row span { font-family: "JetBrains Mono"; }
</style>
</head>
<body>
<h1>Lime → Cyan · Signal Orange · Mint, in context</h1>
<p class="sub">The same B4 "Trail i" mark as the site header, a profile picture, a browser tab and a daily post.</p>
<div class="cols" id="cols"></div>
<script>
const W = [
  { name: "Lime → Cyan", tile: ["#D4FF3A", "#3DE8FF"], glyph: "#0B0B0F", accent: "#D4FF3A", accent2: "#3DE8FF" },
  { name: "Signal Orange", tile: "#FF6A2B", glyph: "#0B0B0F", accent: "#FF6A2B", accent2: "#FF9A5C" },
  { name: "Mint", tile: "#3DFFB5", glyph: "#0B0B0F", accent: "#3DFFB5", accent2: "#9BFFD9" },
];
let n = 0;
const fill = (t) => Array.isArray(t) ? `linear-gradient(135deg, ${t[0]}, ${t[1]})` : t;
const icon = (w, size, round) => {
  const id = "g" + (n++), grad = Array.isArray(w.tile);
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120">${grad ? `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${w.tile[0]}"/><stop offset="1" stop-color="${w.tile[1]}"/></linearGradient></defs>` : ""}
    ${round ? `<circle cx="60" cy="60" r="60"` : `<rect width="120" height="120" rx="30"`} fill="${grad ? `url(#${id})` : w.tile}"/>
    <circle cx="60" cy="31" r="14" fill="${w.glyph}"/><rect x="51" y="54" width="18" height="15" rx="7.5" fill="${w.glyph}"/>
    <rect x="51" y="74" width="18" height="13" rx="6.5" fill="${w.glyph}" fill-opacity=".55"/><rect x="51" y="92" width="18" height="11" rx="5.5" fill="${w.glyph}" fill-opacity=".25"/></svg>`;
};
document.getElementById("cols").innerHTML = W.map((w) => `
  <div class="col">
    <div class="label"><i style="background:${fill(w.tile)}"></i>${w.name}</div>
    <div class="box site">
      <div class="nav"><span class="brand">${icon(w, 30)}ichnora</span><span class="btn" style="background:${fill(w.tile)}">Today's calls</span></div>
      <div class="hero">10 coins. Every day.<br><mark style="background:${fill(w.tile)}">Receipts</mark> included.</div>
      <div class="tagline">Every call leaves a footprint</div>
    </div>
    <div class="box profile">
      <div class="banner" style="background:${Array.isArray(w.tile) ? `linear-gradient(120deg, ${w.tile[0]}33, ${w.tile[1]}55)` : `linear-gradient(120deg, ${w.tile}22, ${w.tile}66)`}"></div>
      <div class="pbody"><div class="avatar">${icon(w, 84, true)}</div>
        <div class="pname">Ichnora</div><div class="phandle">@ichnora</div>
        <div class="pbio">Daily crypto calls: 10 coins for 3 days + 10 for 7 days. Every call graded in public, wins and misses. NFA.</div></div>
    </div>
    <div class="box"><div class="tabs"><div class="tab">${icon(w, 16)} Ichnora · Daily calls</div><div class="tab dim"><span class="fav"></span> New tab</div></div><div style="height:16px;background:#fff"></div></div>
    <div class="box post">
      <div class="ptop"><span style="display:flex;align-items:center;gap:8px;font:800 14px Bricolage Grotesque;color:${w.accent}">${icon(w, 22)} ICHNORA</span><span style="font:600 12px JetBrains Mono;color:#A1A1AC">7-DAY CALL</span></div>
      <div class="ptitle">Oct 24 → Oct 31</div>
      <div class="bar"><i style="background:${fill(w.tile)}"></i></div>
      <div class="row">#1 IRYS <span>$0.0412</span></div><div class="row">#2 BEAM <span>$0.0031</span></div><div class="row">#3 PROM <span>$5.84</span></div>
    </div>
  </div>`).join("");
</script>
</body>
</html>
